services:

  mysql:
    image: mysql:8.4
    container_name: cymercmd-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cymercmd_root}
      MYSQL_DATABASE: ${DB_NAME:-cymercmd}
      MYSQL_USER: ${DB_USER:-cymercmd}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cymercmd_password}

    ports:
      - "3306:3306"

    volumes:
      - cymercmd_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend

    container_name: cymercmd-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-cymercmd}
      DB_PASSWORD: ${DB_PASSWORD:-cymercmd_password}
      DB_NAME: ${DB_NAME:-cymercmd}

      FRONTEND_URL: http://localhost:5173

      NODE_ENV: production

      CYBERCMD_SCAN_MODE: authorized

    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    container_name: cymercmd-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  cymercmd_mysql_data: